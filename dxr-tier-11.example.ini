; dxr-tier-11.ini
;
; Copy this file next to the application's .exe, beside d3d12.dll, and
; rename it to dxr-tier-11.ini. It exists so the shim can be configured
; without a terminal and without a launcher, which matters because a game
; started from Steam or Epic never sees a console environment variable.
;
; An environment variable of the same name always wins over this file.
; Accepted values: 1/true/on/yes and 0/false/off/no.
;
; You do not need this file at all. Every setting below is the default.

; Report DXR Tier 1.1 and rewrite RayQuery shaders into DXR 1.0.
; This is ON by default: putting the DLL here was the opt-in.
; Set to 0 to make the shim report the real tier and translate nothing.
tier11 = 1

; Hand the application the real device and translate NOTHING, while leaving
; the DLL loaded. This is a diagnostic, not a setting. It overrides tier11,
; because the Tier 1.1 answer is itself something the shim can only give
; through the device object it declines to hand over here.
;
; Use it to find out whether a problem is this shim's translation at all: if
; the symptom survives nowrap = 1, the translation is not the cause.
nowrap = 0

; Where to put the log. Blank, or this line absent, means
; %TEMP%\dxr-tier-11-proxy.log, which is where it has always gone.
;
; A FOLDER is accepted as well as a file: the usual name is put inside it. A
; relative path is relative to THIS FILE, that is to the game folder, because
; the working directory of a game started from Steam is not something you can
; predict from here.
;
; If the path cannot be opened, the log goes to the default place and says so
; on its first line, rather than disappearing.
;
; The environment variable is DXR_TIER11_LOG.
;
; log =

; Write out the shaders the rewriter REFUSED, so they can be looked at.
;
; Set it to a folder. Each refused shader lands there as a .dxil container with
; a .txt beside it saying why, up to 64 of them. Run one back through
; `dxrw rewrite` and it reproduces the same refusal offline, where it can be
; disassembled and read.
;
; OFF by default, because it writes megabytes into a folder. A relative path is
; relative to this file, that is to the game folder.
;
; The environment variable is DXR_TIER11_DUMP.
;
; dump = refused-shaders

; ---------------------------------------------------------------------------
; Only read by dxgi.dll, and only if you copied it in.
; ---------------------------------------------------------------------------

; Report a Pascal card under a Turing device id.
;
; Unreal Engine refuses ray tracing on Pascal by PCI DEVICE ID, and it does
; that AFTER accepting the Tier 1.1 answer. No cvar or command line flag turns
; it off. So without this, the shim reports the tier, Unreal believes it, then
; reads the device id and switches ray tracing back off, and nothing happens.
;
; Only the device id changes, and only on the cards Unreal itself lists. The
; card's NAME, its vendor and every capability answer stay exactly as they are,
; so the driver, NVAPI and Windows all still see the real hardware.
;
; This is ON by default: copying dxgi.dll in was the opt-in.
spoof = 1

; Which device id to report. The default is 0x1F08, an RTX 2060: the
; lowest-end card with ray tracing hardware, so nothing assumes more
; performance than there is. Turing rather than Ampere because Unreal carries
; a separate list of Ampere ids.
;
; The environment variable is DXR_TIER11_SPOOFID.
;
; spoofid = 0x1F08
; A BISECT, not a setting. Leave it out unless you are chasing a crash.
;
; Substitute only the first N RayQuery shaders and forward the rest unchanged,
; counted in creation order. Forwarded ones are logged with their index, and
; the driver then rejects them exactly as it rejects any RayQuery shader on
; Tier 1.0, so expect the application to complain.
;
;   rqlimit = 0     substitute nothing
;   rqlimit = 3     substitute the first three
;   absent          substitute all of them, which is the normal behaviour
;
; CAVEAT, learned the hard way: Unreal treats a shader the driver rejects as a
; FATAL error, so any value short of "all" makes an Unreal game die at the
; first forwarded shader. For Unreal use rqdispatch below instead.
; rqlimit = 0

; The bisect that works on Unreal. Every lowered pipeline is still BUILT and
; handed over, so nothing is refused and the game runs; only the dispatch is
; skipped.
;
;   rqdispatch = 0     build them all, execute none
;   rqdispatch = 3     execute only the first three, in creation order
;   absent             execute all of them, the normal behaviour
;
; Rendering will be wrong while this is set. It separates a driver that cannot
; COMPILE a generated library from one that cannot EXECUTE the rays.
; rqdispatch = 0